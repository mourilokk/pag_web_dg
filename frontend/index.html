<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professor Douglas Martins - Recursos para Concursos</title>
    <link rel="shortcut icon" type="image/ico" href="images/1.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    
</head>
<body>

    <!-- Cabeçalho -->
    <div class="header">
        <img src="/frontend/images/logo_semfundo.png" alt="Logo">
        <h1>Professor Douglas Martins</h1>
    </div>

    <!-- Seção Hero -->
    <div class="hero">
        <h2>Transforme suas redações com um especialista!</h2>
        <p>Recursos administrativos para concursos públicos.</p>
        <button class="btn-destaque" id="btnHero">Quero meu cupom</button>
    </div>

    <!-- Seção de Aprovações -->
    <div class="aprovacoes">
        <h2>Aprovações do Professor</h2>
        <img src="/frontend/images/aprovacoes.png" alt="Aprovações">
    </div>

    <!-- Botão para abrir o formulário -->
    <button id="btnAbrirForm">Garanta seu cupom!</button>

    <!-- Modal do Formulário -->
    <div class="modal-bg" id="modalForm">
        <div class="modal-content">
            <button class="close-btn" id="btnFechar">&times;</button>
            <div class="modal-header">Cadastre-se para receber seu cupom!</div>
            <form id="formCadastro">
                <div class="mb-3"><input type="text" class="form-control" id="nome" placeholder="Nome" required></div>
                <div class="mb-3"><input type="email" class="form-control" id="email" placeholder="E-mail" required></div>
                <div class="mb-3"><input type="text" class="form-control" id="estado" placeholder="Estado" required></div>
                <div class="mb-3"><input type="text" class="form-control" id="formacao" placeholder="Formação" required></div>
                <div class="mb-3"><input type="text" class="form-control" id="whatsapp" placeholder="Número WhatsApp" required></div>
                <button type="submit" class="btn-submit">Cadastrar</button>
            </form>
        </div>
    </div>

    <!-- Rodapé -->
    <div class="footer">
        <footer class="footer">
         <p>© 2025 Professor Douglas Martins. Todos os direitos reservados.</p>
        </footer>
    </div>

    <script src="index.js"></script>

</body>
</html>
